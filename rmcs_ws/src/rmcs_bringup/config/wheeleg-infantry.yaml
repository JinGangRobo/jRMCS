auto_aim_component:
  ros__parameters:
    # WARN: 危险！可选 red | blue，生效后裁判系统 ID 缺席时
    # 将强行绑定为对应阵营哨兵，仅供调试，严禁比赛启用。
    # 留空或填 unknow 表示禁用。
    dangerous_fallback: ""
    manual_shoot: false
    enable_rune: false
    camera_translation: [0.25, 0.0, -0.05]
    fire_control:
      bullet_speed: 11.5
      shoot_delay: 0.1
      offset_yaw: 0.0
      offset_pitch: 0.0
      attack_window: 120.0
      degraded_angle_speed: 12.0
      window_redundancy: 0.8
      window_hysteresis: 0.2
      attack_preaim: false
      require_stable_command: false
      yaw_tolerance: 0.07
      pitch_tolerance: 0.04
      rune_idle_duration: 0.4
      rune_shoot_duration: 0.2

