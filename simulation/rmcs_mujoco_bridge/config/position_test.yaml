rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_mujoco_bridge::MuJoCoBridge -> mujoco_bridge
      - rmcs_core::controller::arm::ArmConfig -> arm_config
      - rmcs_mujoco_bridge::PositionTest -> position_test
      - rmcs_core::controller::arm::ArmSolver -> arm_solver

mujoco_bridge:
  ros__parameters:
    gravity: false
    initial_position: [0.1, -0.65, -0.15, 0.85, -0.15, 0.1, 0.15]
    torque_limits: [1.2, 6.0, 3.0, 6.0, 0.6, 0.6, 0.25]

position_test:
  ros__parameters:
    duration: 3.0
    target_position: [0.35, -0.8, 0.15, 1.05, 0.1, -0.1, -0.1]

arm_solver:
  ros__parameters:
    controller_list: [gravity,friction]
